name: Build Samsung SM8550 kernel (stock identity)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Kernel build mode"
        required: true
        type: choice
        options:
          - lkm
          - resukisu
        default: lkm
      package_zip:
        description: "Package the Image into an AnyKernel3 flashable ZIP"
        required: true
        type: boolean
        default: true
      droidspaces:
        description: "启用 DroidSpaces 容器 (SYSVIPC / IPC_NS / PID_NS / devtmpfs)"
        type: boolean
        default: true
      ntsync:
        description: "启用 NTSync (Wine / Proton)"
        type: boolean
        default: true
      bbr:
        description: "启用 BBR；取消则使用 CUBIC"
        type: boolean
        default: true
      zram_lz4:
        description: "ZRAM 默认 LZ4；取消则使用 lzo-rle"
        type: boolean
        default: true
      susfs:
        description: "启用 SUSFS (仅 resukisu 模式生效)"
        type: boolean
        default: true
      zeromount:
        description: "启用 ZeroMount (需要 resukisu + SUSFS)"
        type: boolean
        default: true
      rekernel:
        description: "启用 Re:Kernel (Generic Netlink)"
        type: boolean
        default: true
      baseband_guard:
        description: "启用 Baseband-guard 分区写入保护"
        type: boolean
        default: true
      unicode_fix:
        description: "应用 Unicode 路径修复"
        type: boolean
        default: true
      ptrace_fix:
        description: "应用 ptrace 信息泄漏修复"
        type: boolean
        default: true
      ntfs3:
        description: "启用 NTFS3 读写及 LZX/XPRESS"
        type: boolean
        default: true
      full_tmpfs:
        description: "启用 tmpfs ACL / INODE64 扩展（保留基础 tmpfs）"
        type: boolean
        default: true
      ipset:
        description: "启用全部 ipset 类型及 iptables xt_set"
        type: boolean
        default: true
      ttl_target:
        description: "启用 iptables TTL / IPv6 HL target"
        type: boolean
        default: true
      hide_ipv6_nat:
        description: "隐藏 /proc/config.gz 中的 IPv6 NAT 配置（不关闭 NAT）"
        type: boolean
        default: true
      extra_config:
        description: '额外配置，例如 CONFIG_USER_NS=y;CONFIG_IKCONFIG=y（支持分号或换行）'
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sm8550-build-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.mode }} (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BUILD_MODE: ${{ inputs.mode }}
      KERNEL_TAG: "X710ZCU5CYH4"
      JOBS: "4"
      USE_CCACHE: "0"
      ZIP_AFTER: ${{ inputs.package_zip && '1' || '0' }}

    steps:
      - name: Checkout kernel sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /usr/local/.ghcup /opt/hostedtoolcache
          df -h .

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            libfdt-dev cpio rsync zstd zip unzip curl git python3 patch \
            binutils-aarch64-linux-gnu ca-certificates openssl kmod
          sudo apt-get clean
          df -h .

      - name: Prepare selected config and reference boot image identity
        env:
          INPUT_DROIDSPACES: ${{ inputs.droidspaces }}
          INPUT_NTSYNC: ${{ inputs.ntsync }}
          INPUT_BBR: ${{ inputs.bbr }}
          INPUT_ZRAM_LZ4: ${{ inputs.zram_lz4 }}
          INPUT_SUSFS: ${{ inputs.susfs }}
          INPUT_ZEROMOUNT: ${{ inputs.zeromount }}
          INPUT_REKERNEL: ${{ inputs.rekernel }}
          INPUT_BASEBAND_GUARD: ${{ inputs.baseband_guard }}
          INPUT_UNICODE_FIX: ${{ inputs.unicode_fix }}
          INPUT_PTRACE_FIX: ${{ inputs.ptrace_fix }}
          INPUT_NTFS3: ${{ inputs.ntfs3 }}
          INPUT_FULL_TMPFS: ${{ inputs.full_tmpfs }}
          INPUT_IPSET: ${{ inputs.ipset }}
          INPUT_TTL_TARGET: ${{ inputs.ttl_target }}
          INPUT_HIDE_IPV6_NAT: ${{ inputs.hide_ipv6_nat }}
          EXTRA_CONFIG: ${{ inputs.extra_config }}
        run: python3 scripts/build/ci_config.py prepare "out/$BUILD_MODE/selected.config"

      - name: Fetch AnyKernel3 packaging tools
        if: ${{ inputs.package_zip }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          test -f anykernel3/tools/ak3-core.sh
          rm -rf anykernel3/.git

      # Uses the repository's own build flow. This automatically fetches
      # Samsung clang-r450784e, applies the mode-specific patches, selects
      # ThinLTO + CFI, builds Image and (optionally) packages AnyKernel3.
      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build/build.sh "$BUILD_MODE"
          test -s "out/$BUILD_MODE/arch/arm64/boot/Image"
          python3 scripts/build/ci_config.py verify-image "out/$BUILD_MODE"
          {
            echo '### Kernel build verified'
            echo '```'
            cat "out/$BUILD_MODE/include/config/kernel.release"
            echo '```'
            echo 'Source remains Linux 5.15.220. Displayed identity is copied from the kernel in the supplied boot.img.lz4.'
            echo 'Matching the release string does not guarantee vendor module ABI compatibility.'
            echo '#### Requested config'
            echo '```'
            cat "$CONFIG_FRAGMENT_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h .

      - name: Upload kernel Image, config and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SM8550-${{ inputs.mode }}-${{ github.run_number }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          path: |
            out/${{ inputs.mode }}/arch/arm64/boot/Image
            out/${{ inputs.mode }}/include/config/kernel.release
            out/${{ inputs.mode }}/include/generated/compile.h
            out/${{ inputs.mode }}/build-metadata.json
            out/${{ inputs.mode }}/Module.symvers
            out/${{ inputs.mode }}/System.map
            out/${{ inputs.mode }}/.config
            out/${{ inputs.mode }}/selected.config
            out/${{ inputs.mode }}/features.config
            out/${{ inputs.mode }}/SM8550_*.zip

      - name: Upload failed build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: SM8550-${{ inputs.mode }}-logs-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            out/${{ inputs.mode }}/.make.attempt*.log
            out/${{ inputs.mode }}/.config
            out/${{ inputs.mode }}/selected.config
            out/${{ inputs.mode }}/features.config
